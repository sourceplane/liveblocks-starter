packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
  - "tooling/*"

# pnpm 10 blocks dependency build scripts unless allow-listed; wrangler's
# workerd and esbuild need theirs to verify their platform binaries.
onlyBuiltDependencies:
  - esbuild
  - workerd
  - sharp

# The kit's own override (its package.json `overrides`): one @types/react for
# every package, so tldraw's and the editors' types agree with the app's.
overrides:
  "@types/react": 19.0.12
