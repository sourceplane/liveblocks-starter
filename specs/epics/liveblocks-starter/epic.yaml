# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (LB → LB-1, LB-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: liveblocks-starter
  key: LB
spec:
  title: "Vercel's Liveblocks Starter Kit on Cloudflare Workers and D1"
  summary: "Vercel's Liveblocks Starter Kit — Liveblocks' Next.js Starter Kit: rich-text documents, notes, a whiteboard and a canvas edited together in real time, with comments, notifications, sharing and organizations — runs on Cloudflare Workers + Static Assets with its directory of users and organizations and its session secret in Cloudflare D1, its documents in a Liveblocks project the owner connects after the build, inside the Cirrus baseline's repository conventions, and becomes an Orun baseline that takes a new collaborative app from nothing to live on stage and prod in one landing."
  state: completed
  milestones:
    - name: "LB0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [LB-1]
    - name: "LB1 — the collaborative app on Workers and D1"
      exitCriteria:
        - "apps/web is the upstream kit, built with webpack by OpenNext into one Worker with Static Assets, within Workers Free's 3 MiB"
        - "the kit's directory is D1 tables and migrations; lib/database keeps its four functions, signatures and semantics; the session secret is generated in D1"
        - "without a Liveblocks key the site builds, serves and says Liveblocks is not connected, with no request sent; with one, the room auth and the documents reach Liveblocks"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green, and the README says how every Vercel piece maps to Cloudflare"
      tasks: [LB-2]
    - name: "LB2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new collaborative app from nothing to live on stage and prod in one landing, then record it"
        - "a product built from it carries the product only, renamed throughout to its own name, repository, Worker and database names, with the kit's licence intact"
        - "Baseline CI is green: contract tests, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier — the stage lanes' steps in staged job trees, the Worker served with no Liveblocks project and against a stand-in Liveblocks API"
      tasks: [LB-3]
