apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The collaborative app (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment; its directory in D1, its documents in Liveblocks)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  # Its pages, attached to it in the workspace's catalog: what the Docs
  # library shows for it, and what the catalog's docs and runbook checks read.
  # Generated from what this manifest and its sources declare.
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture, title: Architecture }
      - { path: docs/runbook.md, role: runbook, title: Runbook }
  # `app`, not `web`: a domain and a component share one name space in the
  # catalog, and a domain called `web` hid this component from it.
  domain: app
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # INFRA BEFORE APP. The Worker binds the D1 database by id, and the id is
  # rendered into its config during the build from the wiring document the
  # cloudflare-d1 root lease-publishes after its apply; and the app reads the
  # directory (users, organizations, memberships) and its generated session
  # secret, which db-migrate creates in that database. A job resolves
  # its secrets when it STARTS, so on a merge to main this deploy waits for
  # both (enforced) — one convergence runs cloudflare-d1 → db-migrate → web
  # per environment, and the document and the schema are there. A pull request
  # deploys nothing, so nothing on one waits (advisory).
  dependsOn:
    - component: cloudflare-d1
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    - component: db-migrate
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  secretEnv:
    WIRING_CLOUDFLARE_D1_STAGE: "secret://liveblocks-starter/liveblocks-starter/stage/WIRING_CLOUDFLARE_D1"
    WIRING_CLOUDFLARE_D1_PROD: "secret://liveblocks-starter/liveblocks-starter/prod/WIRING_CLOUDFLARE_D1"
  # The Liveblocks project's secret key and its webhook signing secret, stored
  # per environment as the product's secrets LIVEBLOCKS_SECRET_KEY and
  # LIVEBLOCKS_WEBHOOK_SECRET_KEY (README → Connecting Liveblocks). The Worker
  # reads both at request time, so the build hands them to it as Worker
  # secrets and no bundle contains them (buildCommand below). BEST-EFFORT
  # references, wire-now-seed-later: a key nobody has stored yet is skipped
  # when the job resolves its secrets (no env var, no failure), and the site
  # without it serves with a "Liveblocks is not connected" dashboard — so a
  # fresh product deploys and serves before its owner has a Liveblocks
  # project at all.
  optionalSecretEnv:
    LIVEBLOCKS_SECRET_KEY: "secret://liveblocks-starter/liveblocks-starter/{{ .environment }}/LIVEBLOCKS_SECRET_KEY"
    LIVEBLOCKS_WEBHOOK_SECRET_KEY: "secret://liveblocks-starter/liveblocks-starter/{{ .environment }}/LIVEBLOCKS_WEBHOOK_SECRET_KEY"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: liveblocks-starter-web-{dev,stage,prod}.
    workerName: liveblocks-starter-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config, then build. stage and prod
    # render from the wiring document their cloudflare-d1 apply published
    # (secretEnv above, resolved before the job's first step); dev, which no
    # root applies to and which only verifies, renders from the committed
    # fixture. The committed wrangler.jsonc (the fixture render) is what the
    # composition's verify-app-structure step finds before this runs.
    #
    # Liveblocks' keys never reach the build (`env -u`): the Worker reads them
    # at request time, so neither a bundle nor the bundler's cache holds them.
    # Then each key the environment has goes to the Worker as a SECRET
    # (tooling/wire/worker-secrets.mjs: `wrangler secret bulk`, the values
    # over stdin) before the composition deploys it. Only the deploy lane holds
    # a Cloudflare credential, so a verify lane builds the same and pushes
    # nothing.
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components cloudflare-d1 --env "${ORUN_ENVIRONMENT}" --fixture wiring.fixture.json --fixture-envs dev && env -u LIVEBLOCKS_SECRET_KEY -u LIVEBLOCKS_WEBHOOK_SECRET_KEY pnpm exec turbo run build --filter=@app/web && node ../../tooling/wire/worker-secrets.mjs --secret LIVEBLOCKS_SECRET_KEY --secret LIVEBLOCKS_WEBHOOK_SECRET_KEY --worker "liveblocks-starter-web-${ORUN_ENVIRONMENT}" --config wrangler.jsonc

    # Smoke: the marketing page renders to its end (`</html>` — a render that
    # throws partway through a streamed page still sent a 200), and
    # /api/health answers ok — which only the Worker can, by counting the
    # users table through its DB binding, so it proves the database bound,
    # the migrations applied and the Worker serving, whether or not Liveblocks
    # is connected. Read-only. Each response is buffered before grep so an
    # early match cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q '</html>' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
